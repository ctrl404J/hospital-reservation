spring.application.name=hospital-reservation
# 1. Database 연결 설정 (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_db?serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. 💡 로깅 설정
#logging.level.root=info
logging.level.com.hospital.hospitalreservation=debug
logging.level.org.hibernate.SQL=debug